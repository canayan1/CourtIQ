<meta charset="utf-8">
<title>DropVolley — Court IQ reel</title>
<style>
  /* App-native identity: clay court + cream/parchment (AppPalette), English,
     DropVolley / Court IQ. 9:16 stage scaled to fit; screen-record for the Reel.
     Every reel drives to the app. */
  :root{
    --bg0:#F4ECDD; --bg1:#FBF4E7; --court:#C65C31; --court-hi:#D97A4A;
    --court2:#B85228; --line:rgba(255,255,255,.94); --net:#E4A426;
    --ball:#E8E24A; --opp:#1E2938; --you:#E7B23C;
    --ink:#20262F; --ink-dim:#6B6157; --clay:#C15A2F; --clay-deep:#8F3F1F;
    --cream:#FCF7EE; --gold:#C99418;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#0c0c0c;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{position:relative;width:1080px;height:1920px;transform-origin:center;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 100%);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden;}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 80% at 50% 30%, transparent 60%, rgba(120,70,30,.08) 100%);}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:96px 76px 78px;}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:27px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--clay);opacity:0;animation:fade .6s .1s forwards;}
  .eyebrow .cat{color:var(--ink-dim);}
  .dotmark{width:13px;height:13px;border-radius:50%;background:var(--clay);}

  h1{margin-top:26px;font-size:84px;line-height:1.0;font-weight:900;letter-spacing:-.025em;text-transform:uppercase;}
  h1 .l1{display:block;color:var(--ink);opacity:0;animation:rise .7s .25s forwards;}
  h1 .l2{display:block;color:var(--clay);opacity:0;animation:rise .7s .5s forwards;}
  .sub{margin-top:30px;font-size:39px;line-height:1.28;color:var(--ink-dim);font-weight:500;max-width:21ch;
    opacity:0;animation:rise .7s .8s forwards;}

  .court-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;}
  svg.court{width:548px;height:auto;filter:drop-shadow(0 26px 54px rgba(120,60,30,.28));}
  .court .surface{fill:var(--court);}
  .court .shade{fill:rgba(0,0,0,.06);}
  .court .ln{stroke:var(--line);stroke-width:4;fill:none;opacity:0;animation:fade .5s 1.1s forwards;}
  .court .net{stroke:var(--net);stroke-width:8;opacity:0;animation:netSweep .6s 1.5s forwards;}
  .court .traj{stroke:#fff;stroke-width:3;stroke-dasharray:9 12;opacity:0;animation:fade .5s 2.2s forwards;}
  .pip{opacity:0;}
  .pip.opp{animation:pop .45s 1.9s cubic-bezier(.2,1.3,.5,1) forwards;}
  .pip.you{animation:pop .45s 2.15s cubic-bezier(.2,1.3,.5,1) forwards;}
  .pip circle{stroke:#fff;stroke-width:4;}
  .pip text{font-size:32px;font-weight:900;text-anchor:middle;dominant-baseline:central;}
  .ball{opacity:0;animation:ballIn .3s 2.4s forwards;}
  .ball circle{fill:var(--ball);stroke:#3a3a1a;stroke-width:3;}
  .trail{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s 2.5s cubic-bezier(.4,0,.2,1) forwards;}
  .chip{position:absolute;top:8px;right:8px;font-size:22px;font-weight:800;letter-spacing:.06em;
    color:#fff;background:var(--ink);padding:8px 15px;border-radius:10px;opacity:0;animation:fade .5s 1.7s forwards;}

  .cta{margin-top:22px;border-radius:26px;padding:28px 30px;text-align:center;
    background:var(--clay);opacity:0;animation:rise .6s 3.4s forwards;box-shadow:0 16px 34px rgba(150,60,25,.28);}
  .cta .big{font-size:40px;font-weight:900;letter-spacing:.01em;color:#fff;text-transform:uppercase;}
  .cta .small{margin-top:8px;font-size:28px;color:#FBE6D4;}
  .foot{margin-top:26px;display:flex;align-items:center;gap:16px;opacity:0;animation:fade .6s 3.7s forwards;}
  .wordmark{font-size:38px;font-weight:900;color:var(--ink);letter-spacing:-.01em;}
  .wordmark .ball{color:var(--clay);}
  .store{margin-left:auto;font-size:27px;font-weight:700;color:var(--ink-dim);display:flex;align-items:center;gap:9px;}
  .store .apple{font-size:30px;color:var(--ink);}

  @keyframes fade{to{opacity:1;}}
  @keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
  @keyframes ballIn{to{opacity:1;}}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @keyframes netSweep{from{opacity:0;stroke-dashoffset:600;}to{opacity:1;stroke-dashoffset:0;}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;}}
</style>

<div id="stage">
  <div class="wrap">
    <div class="eyebrow"><span class="dotmark"></span><span id="eyebrow">DROPVOLLEY</span> · <span class="cat" id="cat">COURT IQ</span></div>
    <h1><span class="l1" id="h1"></span><span class="l2" id="h2"></span></h1>
    <div class="sub" id="sub"></div>

    <div class="court-area">
      <svg class="court" id="court" viewBox="0 0 300 470" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="cta">
      <div class="big" id="ctaBig">ANSWER IN THE CAPTION</div>
      <div class="small" id="ctaSmall">Save it — then train your Tennis IQ free in DropVolley</div>
    </div>
    <div class="foot">
      <div class="wordmark"><span class="ball">●</span> DropVolley</div>
      <div class="store"><span class="apple"></span> Free on the App Store</div>
    </div>
  </div>
</div>

<script>
  const S = window.__REEL__ || {
    eyebrow:"DROPVOLLEY", cat:"COURT IQ",
    headline1:"THE PUSHER KEEPS", headline2:"WINNING. NOW WHAT?",
    sub:"No weapons, but every ball comes back — and you keep losing.",
    ctaBig:"ANSWER IN THE CAPTION", ctaSmall:"Save it — then train your Tennis IQ free in DropVolley",
    diagram:{surface:"clay", youX:0.5, youY:0.96, opponentX:0.5, opponentY:0.06,
             ballOriginX:0.5, ballOriginY:0.14, ballTargetX:0.5, ballTargetY:0.62, scoreChip:"HIGH BALL · BH"}
  };
  for(const [id,val] of Object.entries({eyebrow:S.eyebrow,cat:S.cat,h1:S.headline1,h2:S.headline2,sub:S.sub,ctaBig:S.ctaBig,ctaSmall:S.ctaSmall}))
    document.getElementById(id).textContent = val;

  const d = S.diagram, C = document.getElementById("court");
  const X0=20, Y0=20, W=260, H=430;
  const px = nx => X0 + nx*W, py = ny => Y0 + ny*H;
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

  C.appendChild(mk("rect",{x:X0,y:Y0,width:W,height:H,rx:4,class:"surface"}));
  C.appendChild(mk("rect",{x:X0,y:Y0,width:W,height:H/2,rx:4,class:"shade"})); // far half slightly darker
  const midY=Y0+H/2, svcTop=Y0+H*0.30, svcBot=Y0+H*0.70, cx=X0+W/2;
  const lines=[
    [X0,Y0,X0,Y0+H],[X0+W,Y0,X0+W,Y0+H],[X0,Y0,X0+W,Y0],[X0,Y0+H,X0+W,Y0+H],
    [X0,svcTop,X0+W,svcTop],[X0,svcBot,X0+W,svcBot],[cx,svcTop,cx,svcBot],
    [X0+W*0.14,Y0,X0+W*0.14,Y0+H],[X0+W*0.86,Y0,X0+W*0.86,Y0+H],
  ];
  lines.forEach(([x1,y1,x2,y2])=>C.appendChild(mk("line",{x1,y1,x2,y2,class:"ln"})));
  C.appendChild(mk("line",{x1:X0-6,y1:midY,x2:X0+W+6,y2:midY,class:"net"}));

  C.appendChild(mk("line",{x1:px(d.ballOriginX),y1:py(d.ballOriginY),x2:px(d.ballTargetX),y2:py(d.ballTargetY),class:"traj"}));
  const ox=px(d.ballOriginX),oy=py(d.ballOriginY),tx=px(d.ballTargetX),ty=py(d.ballTargetY);
  const len=Math.hypot(tx-ox,ty-oy);
  const trail=mk("line",{x1:ox,y1:oy,x2:tx,y2:ty,class:"trail"}); trail.style.setProperty("--len",len.toFixed(1)); C.appendChild(trail);

  function pip(nx,ny,label,fill,txt,cls){
    const g=mk("g",{class:"pip "+cls,style:"transform-box:fill-box;transform-origin:center;"});
    g.appendChild(mk("circle",{cx:px(nx),cy:py(ny),r:18,fill}));
    const t=mk("text",{x:px(nx),y:py(ny),fill:txt}); t.textContent=label; g.appendChild(t); C.appendChild(g);
  }
  pip(d.opponentX,d.opponentY,"OP","var(--opp)","#fff","opp");
  pip(d.youX,d.youY,"YOU","var(--you)","#20262F","you");
  const ball=mk("g",{class:"ball"}); ball.appendChild(mk("circle",{cx:tx,cy:ty,r:9})); C.appendChild(ball);

  if(d.scoreChip){const chip=document.createElement("div");chip.className="chip";chip.textContent=d.scoreChip;
    document.querySelector(".court-area").appendChild(chip);}

  function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById("stage").style.transform=`scale(${s})`;}
  fit(); addEventListener("resize",fit);
  setInterval(()=>document.getElementById("stage").querySelectorAll("*").forEach(el=>{el.style.animation="none";void el.offsetWidth;el.style.animation="";}),7000);
</script>
