<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FCF7EE;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-clock"
        class="scene"
        data-composition-id="02-clock"
        data-composition-src="compositions/frames/02-clock.html"
        data-start="4"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-source-cta"
        class="scene"
        data-composition-id="03-source-cta"
        data-composition-src="compositions/frames/03-source-cta.html"
        data-start="14"
        data-duration="6"
        data-track-index="0"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-clock", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-clock", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-03-source-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
