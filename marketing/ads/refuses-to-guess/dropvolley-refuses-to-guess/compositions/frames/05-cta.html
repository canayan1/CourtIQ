  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-cta"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var lineA = q("#cta05-line-a");
      var lineB = q("#cta05-line-b");
      var rule = q("#cta05-rule");
      var tile = q("#cta05-tile");
      var shot = q("#cta05-shot");
      var dot = q("#cta05-dot");
      var mark = q("#cta05-mark");
      var sweep = q("#cta05-sweep");
      var fine = q("#cta05-fine");

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–1.2s) — the line settles centred-left, the capture
         arrives offset right and slightly below. Long-tail settles only. */
      tl.fromTo(
        lineA,
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        lineB,
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        0.22,
      );
      tl.fromTo(
        tile,
        { opacity: 0 },
        { opacity: 1, duration: 1.0, ease: "power2.out" },
        0.3,
      );
      tl.fromTo(
        shot,
        { opacity: 0, x: 18, y: 38 },
        { opacity: 1, x: 0, y: 0, duration: 1.0, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        rule,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" },
        0.85,
      );

      /* Scene 2 (1.2–2.2s) — the wordmark fades up beneath the line with the
         clay dot; the supporting capture recedes as the mark settles whole
         (the blueprint's "satellites clear" finisher), then the underline
         sweeps beneath the wordmark. */
      tl.fromTo(
        dot,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.18,
      );
      tl.fromTo(
        mark,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        1.26,
      );
      tl.fromTo(
        shot,
        { opacity: 1, x: 0 },
        {
          opacity: 0.64,
          x: 16,
          duration: 1.05,
          ease: "power2.out",
          immediateRender: false,
        },
        1.4,
      );
      tl.fromTo(
        tile,
        { opacity: 1 },
        {
          opacity: 0.7,
          duration: 1.05,
          ease: "power2.out",
          immediateRender: false,
        },
        1.4,
      );
      tl.fromTo(
        sweep,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.85, ease: "power3.out" },
        1.62,
      );

      /* Scene 3 — the required disclaimer. It used to fade up at 2.3s of a
         3s frame, which left it fully on screen for about a tenth of a
         second: legally present, practically invisible, and the first thing
         a loop would cut. It now lands early and holds for over three
         seconds, which is the whole reason the frame is 4s. */
      tl.fromTo(
        fine,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power2.out" },
        0.85,
      );

      /* hold the landed frame to the full 4s — no exit, nothing moves */
      tl.set(fine, { opacity: 1 }, 4);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-cta"] = tl;
      tl.seek(0);
    })();
  </script>
